
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Selectors Demo</title>

<style>
* {
    box-sizing: border-box;
    margin: 10px;
}

body {
    font-family: Arial, sans-serif;
    background-color: #101820;
    color: white;
    padding: 20px;
}

main {
    border: 2px solid #00e5ff;
    padding: 25px;
    background-color: #1c2b36;
    border-radius: 12px;
}

h1 {
    font-family: Arial, sans-serif;
    color: #00e5ff;
    text-align: center;
}

p {
    margin-left: 20px;
    font-size: 18px;
}

#copyright {
    font-size: 14px;
    color: #bbbbbb;
}

.blue {
    color: #00e5ff;
}

.right {
    text-align: right;
}
</style>
</head>

<body>

<main>
    <h1>Upcoming Tech Speakers</h1>

    <p class="blue">January: Web Development Workshop</p>
    <p class="blue">February: Artificial Intelligence Seminar</p>
    <p>March: Software Development Conference</p>
</main>

<footer>
    <p id="copyright" class="blue right">
        Copyright 2026 | Tech Events
    </p>
</footer>

</body>
</html>
